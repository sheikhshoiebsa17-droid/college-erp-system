<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>College ERP Dashboard</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold">

            🎓 College ERP System

        </a>

    </div>

</nav>

<div class="container mt-4">

    <h2 class="mb-4">

        Welcome Administrator 👋

    </h2>

    <div class="row">

        <!-- Student Card -->

        <div class="col-md-4">

            <div class="card shadow border-0 text-white bg-primary mb-4">

                <div class="card-body">

                    <h5>Total Students</h5>

                    <h1 th:text="${studentCount}">0</h1>

                    <a th:href="@{/students}" class="btn btn-light">

                        Manage Students

                    </a>

                </div>

            </div>

        </div>

        <!-- Faculty Card -->

        <div class="col-md-4">

            <div class="card shadow border-0 text-white bg-success mb-4">

                <div class="card-body">

                    <h5>Total Faculty</h5>

                    <h1 th:text="${facultyCount}">0</h1>

                    <a th:href="@{/faculty}" class="btn btn-light">

                        Manage Faculty

                    </a>

                </div>

            </div>

        </div>

        <!-- Course Card -->

        <div class="col-md-4">

            <div class="card shadow border-0 text-white bg-info mb-4">

                <div class="card-body">

                    <h5>Total Courses</h5>

                    <h1 th:text="${courseCount}">0</h1>

                    <a th:href="@{/courses}" class="btn btn-light">

                        Manage Courses

                    </a>

                </div>

            </div>

        </div>

    </div>

    <!-- Quick Actions -->

    <div class="card shadow">

        <div class="card-header bg-dark text-white">

            Quick Actions

        </div>

        <div class="card-body">

            <div class="row text-center">

                <div class="col-md-4">

                    <a th:href="@{/students/new}" class="btn btn-primary w-100">

                        ➕ Add Student

                    </a>

                </div>

                <div class="col-md-4">

                    <a th:href="@{/faculty/new}" class="btn btn-success w-100">

                        ➕ Add Faculty

                    </a>

                </div>

                <div class="col-md-4">

                    <a th:href="@{/courses/new}" class="btn btn-info w-100 text-white">

                        ➕ Add Course

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
