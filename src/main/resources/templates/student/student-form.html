<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Student Form</title>

    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Custom CSS -->

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <!-- Header -->

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">

                        <i class="bi bi-person-fill-add"></i>

                        <span th:text="${student.id == null ? 'Add Student' : 'Update Student'}">

                            Add Student

                        </span>

                    </h3>

                </div>

                <div class="card-body">

                    <form th:action="${student.id == null} ?
                                     @{/students/save} :
                                     @{/students/update}"
                          th:object="${student}"
                          method="post">

                        <!-- Hidden ID -->

                        <input type="hidden"
                               th:field="*{id}">
                        <!-- ================= Student Details ================= -->

                        <div class="row">

                            <!-- First Name -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    <i class="bi bi-person-fill"></i>

                                    First Name

                                </label>

                                <input
                                        type="text"
                                        class="form-control"
                                        th:field="*{firstName}"
                                        placeholder="Enter First Name">

                                <div class="text-danger mt-1"
                                     th:if="${#fields.hasErrors('firstName')}"
                                     th:errors="*{firstName}">
                                </div>

                            </div>

                            <!-- Last Name -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    <i class="bi bi-person-fill"></i>

                                    Last Name

                                </label>

                                <input
                                        type="text"
                                        class="form-control"
                                        th:field="*{lastName}"
                                        placeholder="Enter Last Name">

                                <div class="text-danger mt-1"
                                     th:if="${#fields.hasErrors('lastName')}"
                                     th:errors="*{lastName}">
                                </div>

                            </div>

                        </div>

                        <div class="row">

                            <!-- Email -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    <i class="bi bi-envelope-fill"></i>

                                    Email

                                </label>

                                <input
                                        type="email"
                                        class="form-control"
                                        th:field="*{email}"
                                        placeholder="Enter Email Address">

                                <div class="text-danger mt-1"
                                     th:if="${#fields.hasErrors('email')}"
                                     th:errors="*{email}">
                                </div>

                            </div>

                            <!-- Phone -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    <i class="bi bi-telephone-fill"></i>

                                    Phone Number

                                </label>

                                <input
                                        type="text"
                                        class="form-control"
                                        th:field="*{phone}"
                                        placeholder="Enter Phone Number">

                                <div class="text-danger mt-1"
                                     th:if="${#fields.hasErrors('phone')}"
                                     th:errors="*{phone}">
                                </div>

                            </div>

                        </div>

                        <!-- Address -->

                        <div class="mb-3">

                            <label class="form-label">

                                <i class="bi bi-geo-alt-fill"></i>

                                Address

                            </label>

                            <textarea
                                    class="form-control"
                                    rows="3"
                                    th:field="*{address}"
                                    placeholder="Enter Address">
    </textarea>

                            <div class="text-danger mt-1"
                                 th:if="${#fields.hasErrors('address')}"
                                 th:errors="*{address}">
                            </div>

                        </div>

                        <!-- ================= Gender, Department & Semester ================= -->

                        <div class="row">

                            <!-- Gender -->

                            <div class="col-md-4 mb-3">

                                <label class="form-label">

                                    <i class="bi bi-person-badge-fill"></i>

                                    Gender

                                </label>

                                <select class="form-select"
                                        th:field="*{gender}">

                                    <option value="">-- Select Gender --</option>

                                    <option value="Male">Male</option>

                                    <option value="Female">Female</option>

                                    <option value="Other">Other</option>

                                </select>

                                <div class="text-danger mt-1"
                                     th:if="${#fields.hasErrors('gender')}"
                                     th:errors="*{gender}">
                                </div>

                            </div>

                            <!-- Department -->

                            <div class="col-md-4 mb-3">

                                <label class="form-label">

                                    <i class="bi bi-building-fill"></i>

                                    Department

                                </label>

                                <select class="form-select"
                                        th:field="*{department}">

                                    <option value="">-- Select Department --</option>

                                    <option value="CSE">CSE</option>

                                    <option value="ISE">ISE</option>

                                    <option value="ECE">ECE</option>

                                    <option value="EEE">EEE</option>

                                    <option value="ME">ME</option>

                                    <option value="CIVIL">CIVIL</option>

                                </select>

                                <div class="text-danger mt-1"
                                     th:if="${#fields.hasErrors('department')}"
                                     th:errors="*{department}">
                                </div>

                            </div>

                            <!-- Semester -->

                            <div class="col-md-4 mb-3">

                                <label class="form-label">

                                    <i class="bi bi-mortarboard-fill"></i>

                                    Semester

                                </label>

                                <select class="form-select"
                                        th:field="*{semester}">

                                    <option value="">-- Select Semester --</option>

                                    <option value="1">Semester 1</option>

                                    <option value="2">Semester 2</option>

                                    <option value="3">Semester 3</option>

                                    <option value="4">Semester 4</option>

                                    <option value="5">Semester 5</option>

                                    <option value="6">Semester 6</option>

                                    <option value="7">Semester 7</option>

                                    <option value="8">Semester 8</option>

                                </select>

                                <div class="text-danger mt-1"
                                     th:if="${#fields.hasErrors('semester')}"
                                     th:errors="*{semester}">
                                </div>

                            </div>

                        </div>

                        <!-- ================= Buttons ================= -->

                        <div class="d-flex justify-content-between mt-4">

                            <a th:href="@{/students}"
                               class="btn btn-secondary">

                                <i class="bi bi-arrow-left-circle"></i>

                                Back

                            </a>

                            <button type="submit"
                                    class="btn btn-primary">

                                <i class="bi bi-save"></i>

                                <span th:text="${student.id == null ? 'Save Student' : 'Update Student'}">

            Save Student

        </span>

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- ================= Bootstrap JS ================= -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
