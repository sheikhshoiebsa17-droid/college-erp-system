<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Students | Student ERP</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container-fluid">

        <a class="navbar-brand fw-bold" th:href="@{/}">
            🎓 Student ERP System
        </a>

        <div class="ms-auto">

            <a th:href="@{/}" class="btn btn-outline-light">
                <i class="bi bi-house"></i> Dashboard
            </a>

        </div>

    </div>
</nav>

<div class="container mt-4">
    <!-- ================= Success Message ================= -->

    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show shadow-sm"
         role="alert">

        <i class="bi bi-check-circle-fill"></i>

        <span th:text="${successMessage}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>

    <!-- Error Message -->

    <div th:if="${errorMessage}"
         class="alert alert-danger alert-dismissible fade show shadow-sm"
         role="alert">

        <i class="bi bi-exclamation-triangle-fill"></i>

        <span th:text="${errorMessage}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <div class="row align-items-center">

                <div class="col-md-6">

                    <h3>
                        <i class="bi bi-people-fill"></i>
                        Student Management
                    </h3>

                </div>

                <div class="col-md-6 text-end">

                    <a th:href="@{/students/new}" class="btn btn-light">

                        <i class="bi bi-person-plus-fill"></i>

                        Add Student

                    </a>

                </div>

            </div>

        </div>

        <div class="card-body">

            <div class="row mb-3">

                <div class="col-md-8">

                    <form th:action="@{/students}" method="get">

                        <div class="input-group">

                            <input
                                    type="text"
                                    name="keyword"
                                    class="form-control"
                                    placeholder="Search by Name, Email or Department..."
                                    th:value="${keyword}">

                            <button
                                    type="submit"
                                    class="btn btn-primary">

                                <i class="bi bi-search"></i>

                                Search

                            </button>

                            <a th:href="@{/students}"
                               class="btn btn-secondary">

                                <i class="bi bi-arrow-clockwise"></i>

                                Clear

                            </a>

                        </div>

                    </form>

                </div>

            </div>

            <div class="table-responsive">

                <table class="table table-bordered table-hover table-striped align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>

                        <th>First Name</th>

                        <th>Last Name</th>

                        <th>Email</th>

                        <th>Phone</th>

                        <th>Department</th>

                        <th>Semester</th>

                        <th width="180">Actions</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:if="${students.isEmpty()}">

                        <td colspan="8" class="text-center text-danger">

                            No Student Records Found

                        </td>

                    </tr>

                    <tr th:each="student : ${students}">

                        <td th:text="${student.id}"></td>

                        <td th:text="${student.firstName}"></td>

                        <td th:text="${student.lastName}"></td>

                        <td th:text="${student.email}"></td>

                        <td th:text="${student.phone}"></td>

                        <td th:text="${student.department}"></td>

                        <td th:text="${student.semester}"></td>

                        <td>

                            <a
                                    th:href="@{/students/edit/{id}(id=${student.id})}"
                                    class="btn btn-warning btn-sm">

                                <i class="bi bi-pencil-square"></i>

                                Edit

                            </a>

                            <a href="#"
                               class="btn btn-danger btn-sm"
                               th:attr="data-url=@{/students/delete/{id}(id=${student.id})}"
                               onclick="confirmDelete(this)">

                                <i class="bi bi-trash-fill"></i>

                                Delete

                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>
            <!-- Pagination -->

            <nav th:if="${totalPages > 1}" class="mt-4">

                <ul class="pagination justify-content-center">

                    <!-- Previous -->

                    <li class="page-item"
                        th:classappend="${currentPage == 1} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/students(page=${currentPage - 1})}">

                            Previous

                        </a>

                    </li>

                    <!-- Page Numbers -->

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(1, totalPages)}"
                        th:classappend="${currentPage == i} ? 'active'">

                        <a class="page-link"
                           th:text="${i}"
                           th:href="@{/students(page=${i})}">

                        </a>

                    </li>

                    <!-- Next -->

                    <li class="page-item"
                        th:classappend="${currentPage == totalPages} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/students(page=${currentPage + 1})}">

                            Next

                        </a>

                    </li>

                </ul>

            </nav>

        </div>

    </div>

</div>
<!-- SweetAlert2 -->

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>

    function confirmDelete(button) {

        const url = button.getAttribute("data-url");

        Swal.fire({

            title: "Delete Student?",

            text: "This action cannot be undone!",

            icon: "warning",

            showCancelButton: true,

            confirmButtonColor: "#dc3545",

            cancelButtonColor: "#6c757d",

            confirmButtonText: "Yes, Delete",

            cancelButtonText: "Cancel"

        }).then((result) => {

            if (result.isConfirmed) {

                window.location.href = url;

            }

        });

    }

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
