<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Attendance Management | College ERP</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body class="bg-light">

<!-- ================= Navbar ================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold">

            🎓 College ERP System

        </a>

        <a th:href="@{/}"
           class="btn btn-light">

            <i class="bi bi-speedometer2"></i>

            Dashboard

        </a>

    </div>

</nav>

<!-- ================= Main Container ================= -->

<div class="container mt-4">

    <div class="card shadow">

        <!-- ================= Header ================= -->

        <div class="card-header bg-success text-white">

            <div class="d-flex justify-content-between align-items-center">

                <h3 class="mb-0">

                    <i class="bi bi-calendar-check-fill"></i>

                    Attendance Management

                </h3>

                <a th:href="@{/attendance/new}"
                   class="btn btn-light">

                    <i class="bi bi-plus-circle"></i>

                    Mark Attendance

                </a>

            </div>

        </div>

        <!-- ================= Body ================= -->

        <div class="card-body">

            <!-- ================= Search ================= -->

            <form th:action="@{/attendance}"
                  method="get"
                  class="row g-3 mb-4">

                <div class="col-md-10">

                    <input type="text"
                           class="form-control"
                           name="keyword"
                           placeholder="Search by Student Name..."
                           th:value="${keyword}">

                </div>

                <div class="col-md-2">

                    <button type="submit"
                            class="btn btn-primary w-100">

                        <i class="bi bi-search"></i>

                        Search

                    </button>

                </div>

            </form>

            <!-- ================= Attendance Table ================= -->

            <table class="table table-bordered table-hover align-middle">

                <thead class="table-dark">

                <tr>

                    <th>ID</th>

                    <th>Student Name</th>

                    <th>Attendance Date</th>

                    <th>Status</th>

                    <th width="180">Actions</th>

                </tr>

                </thead>

                <tbody>

                <tr th:if="${#lists.isEmpty(attendanceList)}">

                    <td colspan="5"
                        class="text-center text-danger fw-bold">

                        No Attendance Records Found

                    </td>

                </tr>

                <tr th:each="attendance : ${attendanceList}">

                    <td th:text="${attendance.id}"></td>

                    <td th:text="${attendance.student.firstName + ' ' + attendance.student.lastName}"></td>

                    <td th:text="${attendance.attendanceDate}"></td>

                    <td>

                        <span class="badge bg-success"
                              th:if="${attendance.status == 'Present'}">

                            Present

                        </span>

                        <span class="badge bg-danger"
                              th:if="${attendance.status == 'Absent'}">

                            Absent

                        </span>

                    </td>

                    <td>

                        <a th:href="@{/attendance/edit/{id}(id=${attendance.id})}"
                           class="btn btn-warning btn-sm">

                            <i class="bi bi-pencil-square"></i>

                            Edit

                        </a>

                        <a th:href="@{/attendance/delete/{id}(id=${attendance.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this attendance record?')">

                            <i class="bi bi-trash"></i>

                            Delete

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
