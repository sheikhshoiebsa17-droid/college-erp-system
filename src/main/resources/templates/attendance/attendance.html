<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Attendance | College ERP</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold">
            🎓 College ERP System
        </a>

        <a th:href="@{/}" class="btn btn-light">
            Dashboard
        </a>

    </div>

</nav>

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <div class="d-flex justify-content-between">

                <h3>

                    <i class="bi bi-calendar-check"></i>

                    Attendance Management

                </h3>

                <a th:href="@{/attendance/new}"
                   class="btn btn-light">

                    Mark Attendance

                </a>

            </div>

        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover">

                <thead class="table-dark">

                <tr>

                    <th>ID</th>

                    <th>Student</th>

                    <th>USN</th>

                    <th>Department</th>

                    <th>Semester</th>

                    <th>Subject</th>

                    <th>Date</th>

                    <th>Status</th>

                    <th>Actions</th>

                </tr>

                </thead>

                <tbody>

                <tr th:if="${attendanceList.isEmpty()}">

                    <td colspan="9"
                        class="text-center text-danger">

                        No Attendance Found

                    </td>

                </tr>

                <tr th:each="attendance : ${attendanceList}">

                    <td th:text="${attendance.id}"></td>

                    <td th:text="${attendance.studentName}"></td>

                    <td th:text="${attendance.usn}"></td>

                    <td th:text="${attendance.department}"></td>

                    <td th:text="${attendance.semester}"></td>

                    <td th:text="${attendance.subject}"></td>

                    <td th:text="${attendance.attendanceDate}"></td>

                    <td>

                        <span class="badge bg-success"
                              th:if="${attendance.status=='Present'}">

                            Present

                        </span>

                        <span class="badge bg-danger"
                              th:if="${attendance.status=='Absent'}">

                            Absent

                        </span>

                    </td>

                    <td>

                        <a th:href="@{/attendance/edit/{id}(id=${attendance.id})}"
                           class="btn btn-warning btn-sm">

                            Edit

                        </a>

                        <a th:href="@{/attendance/delete/{id}(id=${attendance.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Delete attendance record?')">

                            Delete

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>

</html>
