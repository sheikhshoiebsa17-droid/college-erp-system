<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Mark Attendance | College ERP</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success shadow">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold">

            🎓 College ERP System

        </a>

        <a th:href="@{/attendance}" class="btn btn-light">

            Back

        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3>

                <i class="bi bi-calendar-check"></i>

                Mark Attendance

            </h3>

        </div>

        <div class="card-body">

            <form th:action="@{/attendance/save}"
                  th:object="${attendance}"
                  method="post">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Student Name</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{studentName}"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>USN</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{usn}"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Department</label>

                        <select class="form-select"
                                th:field="*{department}">

                            <option value="">Select Department</option>

                            <option value="CSE">CSE</option>
                            <option value="ISE">ISE</option>
                            <option value="ECE">ECE</option>
                            <option value="EEE">EEE</option>
                            <option value="ME">ME</option>
                            <option value="CIVIL">CIVIL</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Semester</label>

                        <select class="form-select"
                                th:field="*{semester}">

                            <option value="">Select Semester</option>

                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Subject</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{subject}"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Date</label>

                        <input type="date"
                               class="form-control"
                               th:field="*{attendanceDate}"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Status</label>

                        <select class="form-select"
                                th:field="*{status}">

                            <option value="">Select Status</option>

                            <option value="Present">Present</option>

                            <option value="Absent">Absent</option>

                        </select>

                    </div>

                </div>

                <hr>

                <button class="btn btn-success">

                    <i class="bi bi-check-circle-fill"></i>

                    Save Attendance

                </button>

                <button type="reset"
                        class="btn btn-secondary">

                    Reset

                </button>

                <a th:href="@{/attendance}"
                   class="btn btn-danger">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
