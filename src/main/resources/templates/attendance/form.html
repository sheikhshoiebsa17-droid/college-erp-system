<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Attendance Form | College ERP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">

                        <i class="bi bi-calendar-check-fill"></i>

                        <span th:if="${attendance.id == null}">
                            Mark Attendance
                        </span>

                        <span th:if="${attendance.id != null}">
                            Edit Attendance
                        </span>

                    </h3>

                </div>

                <div class="card-body">

                    <form th:action="@{/attendance/save}"
                          method="post">

                        <!-- Hidden ID -->

                        <input type="hidden"
                               name="id"
                               th:value="${attendance.id}">

                        <!-- Student -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Student

                            </label>

                            <select class="form-select"
                                    name="studentId"
                                    required>

                                <option value="">
                                    -- Select Student --
                                </option>

                                <option th:each="student : ${students}"
                                        th:value="${student.id}"
                                        th:text="${student.firstName + ' ' + student.lastName}"
                                        th:selected="${attendance.student != null and attendance.student.id == student.id}">
                                </option>

                            </select>

                        </div>

                        <!-- Attendance Date -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Attendance Date

                            </label>

                            <input type="date"
                                   class="form-control"
                                   name="attendanceDate"
                                   th:value="${attendance.attendanceDate}"
                                   required>

                        </div>

                        <!-- Status -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Status

                            </label>

                            <select class="form-select"
                                    name="status"
                                    required>

                                <option value="Present"
                                        th:selected="${attendance.status == 'Present'}">

                                    Present

                                </option>

                                <option value="Absent"
                                        th:selected="${attendance.status == 'Absent'}">

                                    Absent

                                </option>

                            </select>

                        </div>

                        <!-- Buttons -->

                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-success">

                                <i class="bi bi-check-circle"></i>

                                Save Attendance

                            </button>

                            <a th:href="@{/attendance}"
                               class="btn btn-secondary">

                                <i class="bi bi-arrow-left"></i>

                                Back

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
