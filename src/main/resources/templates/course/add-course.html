<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Course | Student ERP</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-info shadow">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold" th:href="@{/}">
            🎓 Student ERP System
        </a>

        <div class="ms-auto">

            <a th:href="@{/courses}" class="btn btn-outline-light">

                <i class="bi bi-arrow-left-circle"></i>

                Back

            </a>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-info text-white">

            <h3>

                <i class="bi bi-book-fill"></i>

                Add Course

            </h3>

        </div>

        <div class="card-body">

            <form th:action="@{/courses/save}"
                  th:object="${course}"
                  method="post">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Course Code</label>

                        <input
                                type="text"
                                class="form-control"
                                placeholder="CS301"
                                th:field="*{courseCode}"
                                required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Course Name</label>

                        <input
                                type="text"
                                class="form-control"
                                placeholder="Data Structures"
                                th:field="*{courseName}"
                                required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Department</label>

                        <select class="form-select"
                                th:field="*{department}">

                            <option value="">Select Department</option>
                            <option value="CSE">CSE</option>
                            <option value="ISE">ISE</option>
                            <option value="ECE">ECE</option>
                            <option value="EEE">EEE</option>
                            <option value="ME">ME</option>
                            <option value="CIVIL">CIVIL</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Semester</label>

                        <select class="form-select"
                                th:field="*{semester}">

                            <option value="">Select Semester</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Credits</label>

                        <input
                                type="number"
                                class="form-control"
                                min="1"
                                max="10"
                                th:field="*{credits}"
                                required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Faculty Name</label>

                        <input
                                type="text"
                                class="form-control"
                                placeholder="Dr. Habeeb"
                                th:field="*{facultyName}"
                                required>

                    </div>

                    <div class="col-12 mb-3">

                        <label class="form-label">Description</label>

                        <textarea
                                class="form-control"
                                rows="4"
                                th:field="*{description}"></textarea>

                    </div>

                </div>

                <hr>

                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-circle-fill"></i>
                    Save Course
                </button>

                <button type="reset" class="btn btn-secondary">
                    Reset
                </button>

                <a th:href="@{/courses}" class="btn btn-danger">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
