<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Courses | Student ERP</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold" th:href="@{/}">
            🎓 Student ERP System
        </a>

        <div class="ms-auto">

            <a th:href="@{/}" class="btn btn-outline-light">

                <i class="bi bi-house"></i>

                Dashboard

            </a>

        </div>

    </div>

</nav>

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-info text-white">

            <div class="row">

                <div class="col-md-6">

                    <h3>

                        <i class="bi bi-book-half"></i>

                        Course Management

                    </h3>

                </div>

                <div class="col-md-6 text-end">

                    <a th:href="@{/courses/new}" class="btn btn-light">

                        <i class="bi bi-plus-circle-fill"></i>

                        Add Course

                    </a>

                </div>

            </div>

        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered table-hover table-striped">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>

                        <th>Code</th>

                        <th>Name</th>

                        <th>Department</th>

                        <th>Semester</th>

                        <th>Credits</th>

                        <th>Faculty</th>

                        <th width="180">Actions</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:if="${courses.isEmpty()}">

                        <td colspan="8" class="text-center text-danger">

                            No Courses Available

                        </td>

                    </tr>

                    <tr th:each="course : ${courses}">

                        <td th:text="${course.id}"></td>

                        <td th:text="${course.courseCode}"></td>

                        <td th:text="${course.courseName}"></td>

                        <td th:text="${course.department}"></td>

                        <td th:text="${course.semester}"></td>

                        <td th:text="${course.credits}"></td>

                        <td th:text="${course.facultyName}"></td>

                        <td>

                            <a th:href="@{/courses/edit/{id}(id=${course.id})}"
                               class="btn btn-warning btn-sm">

                                Edit

                            </a>

                            <a th:href="@{/courses/delete/{id}(id=${course.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Delete this course?')">

                                Delete

                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
