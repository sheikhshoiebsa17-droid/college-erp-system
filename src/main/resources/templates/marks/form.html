<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Add/Edit Marks</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3>

                <i class="bi bi-journal-check"></i>

                <span th:if="${marks.id == null}">
                    Add Student Marks
                </span>

                <span th:unless="${marks.id == null}">
                    Edit Student Marks
                </span>

            </h3>

        </div>

        <div class="card-body">

            <form th:action="@{/marks/save}"
                  th:object="${marks}"
                  method="post">

                <!-- Hidden ID -->

                <input type="hidden"
                       th:field="*{id}">

                <!-- Student -->

                <div class="mb-3">

                    <label class="form-label">

                        Student

                    </label>

                    <select class="form-select"
                            name="studentId"
                            required>

                        <option value="">

                            Select Student

                        </option>

                        <option th:each="student : ${students}"
                                th:value="${student.id}"
                                th:selected="${marks.student != null and marks.student.id == student.id}"
                                th:text="${student.firstName + ' ' + student.lastName}">

                        </option>

                    </select>

                </div>

                <!-- Subject -->

                <div class="mb-3">

                    <label class="form-label">

                        Subject

                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{subject}"
                           placeholder="Enter Subject"
                           required>

                </div>

                <!-- Internal Marks -->

                <div class="mb-3">

                    <label class="form-label">

                        Internal Marks

                    </label>

                    <input type="number"
                           class="form-control"
                           th:field="*{internalMarks}"
                           min="0"
                           max="50"
                           required>

                </div>

                <!-- External Marks -->

                <div class="mb-3">

                    <label class="form-label">

                        External Marks

                    </label>

                    <input type="number"
                           class="form-control"
                           th:field="*{externalMarks}"
                           min="0"
                           max="50"
                           required>

                </div>

                <!-- Buttons -->

                <button type="submit"
                        class="btn btn-success">

                    <i class="bi bi-check-circle"></i>

                    Save Marks

                </button>

                <a th:href="@{/marks}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
