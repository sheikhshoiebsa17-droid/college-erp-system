<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit User | College ERP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<!-- ================= Top Navbar ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            🎓 College ERP System
        </a>

        <div class="ms-auto d-flex align-items-center gap-2">
            <a th:href="@{/users}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left-circle me-1"></i> Back to Users
            </a>
            <a th:href="@{/}" class="btn btn-light btn-sm">
                <i class="bi bi-speedometer2 me-1"></i> Dashboard
            </a>
        </div>
    </div>
</nav>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">

            <!-- Flash Error Alert -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card shadow border-0">
                <div class="card-header bg-warning text-dark py-3">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-pencil-square me-2"></i> Edit User Details
                    </h4>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/users/update}"
                          th:object="${user}"
                          method="post">

                        <!-- Hidden ID -->
                        <input type="hidden" th:field="*{id}" />

                        <!-- Username -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-person text-primary me-1"></i> Username
                            </label>
                            <input type="text"
                                   class="form-control form-control-lg"
                                   th:field="*{username}"
                                   required>
                        </div>

                        <!-- Role Selection -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-shield-lock text-primary me-1"></i> Role & Permissions
                            </label>
                            <select class="form-select form-select-lg" th:field="*{role}" required>
                                <option value="ADMIN">Administrator (Full ERP access)</option>
                                <option value="FACULTY">Faculty (Academic staff)</option>
                                <option value="STUDENT">Student (Portal access)</option>
                            </select>
                        </div>

                        <!-- Reset Password (Optional) -->
                        <div class="mb-3 p-3 bg-light rounded border">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-key text-warning me-1"></i> Set New Password (Optional)
                            </label>
                            <div class="input-group">
                                <input type="password"
                                       id="editPasswordInput"
                                       name="newPassword"
                                       class="form-control form-control-lg"
                                       placeholder="Leave blank to keep existing password">
                                <button class="btn btn-outline-secondary"
                                        type="button"
                                        onclick="togglePasswordVisibility('editPasswordInput', 'editToggleIcon')">
                                    <i class="bi bi-eye" id="editToggleIcon"></i>
                                </button>
                            </div>
                            <div class="form-text text-muted">
                                If you leave this field empty, the user's current password will remain unchanged.
                            </div>
                        </div>

                        <!-- Status Switch -->
                        <div class="mb-4">
                            <div class="form-check form-switch fs-5">
                                <input class="form-check-input"
                                       type="checkbox"
                                       role="switch"
                                       id="editEnabledSwitch"
                                       th:field="*{enabled}">
                                <label class="form-check-label fs-6 fw-semibold align-middle ms-2" for="editEnabledSwitch">
                                    Account Enabled / Active
                                </label>
                            </div>
                        </div>

                        <hr class="my-4">

                        <!-- Action Buttons -->
                        <div class="d-flex gap-2 justify-content-end">
                            <a th:href="@{/users}" class="btn btn-outline-secondary px-4">
                                <i class="bi bi-x-circle me-1"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-warning px-4 fw-bold">
                                <i class="bi bi-check-circle-fill me-1"></i> Update User
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");
    } else {
        input.type = "password";
        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");
    }
}
</script>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
