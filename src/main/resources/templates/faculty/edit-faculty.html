<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Faculty | Student ERP</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-warning shadow">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold text-dark" th:href="@{/}">
            🎓 Student ERP System
        </a>

        <div class="ms-auto">

            <a th:href="@{/faculty}" class="btn btn-dark">

                <i class="bi bi-arrow-left-circle"></i>

                Back

            </a>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h3>

                <i class="bi bi-pencil-square"></i>

                Edit Faculty

            </h3>

        </div>

        <div class="card-body">

            <form th:action="@{/faculty/update}"
                  th:object="${faculty}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">First Name</label>

                        <input
                                type="text"
                                class="form-control"
                                th:field="*{firstName}"
                                required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Last Name</label>

                        <input
                                type="text"
                                class="form-control"
                                th:field="*{lastName}"
                                required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Email</label>

                        <input
                                type="email"
                                class="form-control"
                                th:field="*{email}"
                                required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Phone</label>

                        <input
                                type="text"
                                class="form-control"
                                th:field="*{phone}"
                                required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Gender</label>

                        <select class="form-select"
                                th:field="*{gender}">

                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Department</label>

                        <select class="form-select"
                                th:field="*{department}">

                            <option value="">Select Department</option>

                            <option value="CSE">CSE</option>
                            <option value="ISE">ISE</option>
                            <option value="ECE">ECE</option>
                            <option value="EEE">EEE</option>
                            <option value="ME">ME</option>
                            <option value="CIVIL">CIVIL</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Designation</label>

                        <input
                                type="text"
                                class="form-control"
                                th:field="*{designation}"
                                required>

                    </div>

                </div>

                <hr>

                <button
                        type="submit"
                        class="btn btn-warning">

                    <i class="bi bi-pencil-square"></i>

                    Update Faculty

                </button>

                <a
                        th:href="@{/faculty}"
                        class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
