<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Fee Form</title>

    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Custom CSS -->

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <!-- ================= Header ================= -->

                <div class="card-header bg-success text-white">

                    <h3 class="mb-0">

                        <i class="bi bi-cash-coin"></i>

                        <span th:text="${fee.id == null ? 'Add Fee' : 'Update Fee'}">

                            Add Fee

                        </span>

                    </h3>

                </div>

                <div class="card-body">

                    <form th:action="${fee.id == null} ?
                                     @{/fees/save} :
                                     @{/fees/update}"
                          th:object="${fee}"
                          method="post">

                        <!-- Hidden ID -->

                        <input type="hidden"
                               th:field="*{id}">

                        <!-- ================= Student ================= -->

                        <div class="mb-3">

                            <label class="form-label">

                                <i class="bi bi-person-fill"></i>

                                Student

                            </label>

                            <select class="form-select"
                                    th:field="*{student}"
                                    required>

                                <option value="">-- Select Student --</option>

                                <option th:each="student : ${students}"
                                        th:value="${student.id}"
                                        th:text="${student.firstName + ' ' + student.lastName}">
                                </option>

                            </select>

                        </div>

                        <!-- ================= Semester ================= -->

                        <div class="mb-3">

                            <label class="form-label">

                                <i class="bi bi-mortarboard-fill"></i>

                                Semester

                            </label>

                            <select class="form-select"
                                    th:field="*{semester}"
                                    required>

                                <option value="">-- Select Semester --</option>

                                <option value="1">Semester 1</option>
                                <option value="2">Semester 2</option>
                                <option value="3">Semester 3</option>
                                <option value="4">Semester 4</option>
                                <option value="5">Semester 5</option>
                                <option value="6">Semester 6</option>
                                <option value="7">Semester 7</option>
                                <option value="8">Semester 8</option>

                            </select>

                        </div>

                        <!-- ================= Fee Details ================= -->

                        <div class="row">

                            <!-- Total Fee -->

                            <div class="col-md-4">

                                <div class="mb-3">

                                    <label class="form-label">

                                        <i class="bi bi-cash-stack"></i>

                                        Total Fee

                                    </label>

                                    <input type="number"
                                           step="0.01"
                                           class="form-control"
                                           th:field="*{totalFee}"
                                           placeholder="Enter Total Fee"
                                           required>

                                </div>

                            </div>

                            <!-- Paid Amount -->

                            <div class="col-md-4">

                                <div class="mb-3">

                                    <label class="form-label">

                                        <i class="bi bi-wallet2"></i>

                                        Paid Amount

                                    </label>

                                    <input type="number"
                                           step="0.01"
                                           class="form-control"
                                           th:field="*{paidAmount}"
                                           placeholder="Enter Paid Amount"
                                           required>

                                </div>

                            </div>

                            <!-- Balance Amount -->

                            <div class="col-md-4">

                                <div class="mb-3">

                                    <label class="form-label">

                                        <i class="bi bi-currency-rupee"></i>

                                        Balance Amount

                                    </label>

                                    <input type="number"
                                           step="0.01"
                                           class="form-control"
                                           th:field="*{balanceAmount}"
                                           placeholder="Enter Balance Amount"
                                           required>

                                </div>

                            </div>

                        </div>

                        <!-- ================= Payment Details ================= -->

                        <div class="row">

                            <!-- Payment Date -->

                            <div class="col-md-6">

                                <div class="mb-3">

                                    <label class="form-label">

                                        <i class="bi bi-calendar-date"></i>

                                        Payment Date

                                    </label>

                                    <input type="date"
                                           class="form-control"
                                           th:field="*{paymentDate}"
                                           required>

                                </div>

                            </div>

                            <!-- Payment Mode -->

                            <div class="col-md-6">

                                <div class="mb-3">

                                    <label class="form-label">

                                        <i class="bi bi-credit-card"></i>

                                        Payment Mode

                                    </label>

                                    <select class="form-select"
                                            th:field="*{paymentMode}"
                                            required>

                                        <option value="">-- Select Payment Mode --</option>

                                        <option value="Cash">Cash</option>

                                        <option value="UPI">UPI</option>

                                        <option value="Debit Card">Debit Card</option>

                                        <option value="Credit Card">Credit Card</option>

                                        <option value="Net Banking">Net Banking</option>

                                    </select>

                                </div>

                            </div>

                        </div>

                        <!-- ================= Payment Status ================= -->

                        <div class="mb-3">

                            <label class="form-label">

                                <i class="bi bi-check-circle-fill"></i>

                                Payment Status

                            </label>

                            <select class="form-select"
                                    th:field="*{paymentStatus}"
                                    required>

                                <option value="">-- Select Status --</option>

                                <option value="Paid">Paid</option>

                                <option value="Partial">Partial</option>

                                <option value="Pending">Pending</option>

                            </select>

                        </div>

                        <!-- ================= Remarks ================= -->

                        <div class="mb-4">

                            <label class="form-label">

                                <i class="bi bi-pencil-square"></i>

                                Remarks

                            </label>

                            <textarea class="form-control"
                                      rows="4"
                                      th:field="*{remarks}"
                                      placeholder="Enter remarks (optional)">
    </textarea>

                        </div>

                        <!-- ================= Buttons ================= -->

                        <div class="d-flex justify-content-between">

                            <a th:href="@{/fees}"
                               class="btn btn-secondary">

                                <i class="bi bi-arrow-left-circle"></i>

                                Back

                            </a>

                            <button type="submit"
                                    class="btn btn-success">

                                <i class="bi bi-save"></i>

                                <span th:text="${fee.id == null ? 'Save Fee' : 'Update Fee'}">

            Save Fee

        </span>

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- ================= Bootstrap JS ================= -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
