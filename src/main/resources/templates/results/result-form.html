<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Result Form</title>

    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Custom CSS -->

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <!-- Header -->

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">

                        <i class="bi bi-award-fill"></i>

                        <span th:text="${result.id == null ? 'Add Result' : 'Update Result'}">
                            Add Result
                        </span>

                    </h3>

                </div>

                <div class="card-body">

                    <form th:action="${result.id == null} ?
                                     @{/results/save} :
                                     @{/results/update}"
                          th:object="${result}"
                          method="post">

                        <!-- Hidden ID -->

                        <input type="hidden"
                               th:field="*{id}">
                        <!-- ================= Student ================= -->

                        <div class="mb-3">

                            <label class="form-label">

                                <i class="bi bi-person-fill"></i>

                                Student

                            </label>

                            <select class="form-select"
                                    th:field="*{student}"
                                    required>

                                <option value="">-- Select Student --</option>

                                <option th:each="student : ${students}"
                                        th:value="${student.id}"
                                        th:text="${student.firstName + ' ' + student.lastName}">
                                </option>

                            </select>

                        </div>

                        <!-- ================= Semester ================= -->

                        <div class="mb-3">

                            <label class="form-label">

                                <i class="bi bi-mortarboard-fill"></i>

                                Semester

                            </label>

                            <select class="form-select"
                                    th:field="*{semester}"
                                    required>

                                <option value="">Select Semester</option>

                                <option value="1">Semester 1</option>
                                <option value="2">Semester 2</option>
                                <option value="3">Semester 3</option>
                                <option value="4">Semester 4</option>
                                <option value="5">Semester 5</option>
                                <option value="6">Semester 6</option>
                                <option value="7">Semester 7</option>
                                <option value="8">Semester 8</option>

                            </select>

                        </div>

                        <div class="row">

                            <!-- Total Credits -->

                            <div class="col-md-6">

                                <div class="mb-3">

                                    <label class="form-label">

                                        <i class="bi bi-book-fill"></i>

                                        Total Credits

                                    </label>

                                    <input type="number"
                                           class="form-control"
                                           th:field="*{totalCredits}"
                                           placeholder="Enter Total Credits"
                                           required>

                                </div>

                            </div>

                            <!-- SGPA -->

                            <div class="col-md-6">

                                <div class="mb-3">

                                    <label class="form-label">

                                        <i class="bi bi-graph-up-arrow"></i>

                                        SGPA

                                    </label>

                                    <input type="number"
                                           step="0.01"
                                           class="form-control"
                                           th:field="*{sgpa}"
                                           placeholder="Enter SGPA"
                                           required>

                                </div>

                            </div>

                        </div>

                        <!-- ================= CGPA ================= -->

                        <div class="mb-3">

                            <label class="form-label">

                                <i class="bi bi-bar-chart-fill"></i>

                                CGPA

                            </label>

                            <input type="number"
                                   step="0.01"
                                   class="form-control"
                                   th:field="*{cgpa}"
                                   placeholder="Enter CGPA"
                                   required>

                        </div>
                        <!-- ================= Class & Department Rank ================= -->

                        <div class="row">

                            <!-- Class Rank -->

                            <div class="col-md-6">

                                <div class="mb-3">

                                    <label class="form-label">

                                        <i class="bi bi-trophy-fill"></i>

                                        Class Rank

                                    </label>

                                    <input type="number"
                                           class="form-control"
                                           th:field="*{classRank}"
                                           placeholder="Enter Class Rank"
                                           required>

                                </div>

                            </div>

                            <!-- Department Rank -->

                            <div class="col-md-6">

                                <div class="mb-3">

                                    <label class="form-label">

                                        <i class="bi bi-award-fill"></i>

                                        Department Rank

                                    </label>

                                    <input type="number"
                                           class="form-control"
                                           th:field="*{departmentRank}"
                                           placeholder="Enter Department Rank"
                                           required>

                                </div>

                            </div>

                        </div>

                        <!-- ================= Result Status ================= -->

                        <div class="mb-4">

                            <label class="form-label">

                                <i class="bi bi-check-circle-fill"></i>

                                Result Status

                            </label>

                            <select class="form-select"
                                    th:field="*{resultStatus}"
                                    required>

                                <option value="">-- Select Result Status --</option>

                                <option value="Pass">Pass</option>

                                <option value="Fail">Fail</option>

                            </select>

                        </div>

                        <!-- ================= Buttons ================= -->

                        <div class="d-flex justify-content-between">

                            <a th:href="@{/results}"
                               class="btn btn-secondary">

                                <i class="bi bi-arrow-left-circle"></i>

                                Back

                            </a>

                            <button type="submit"
                                    class="btn btn-primary">

                                <i class="bi bi-save"></i>

                                <span th:text="${result.id == null ? 'Save Result' : 'Update Result'}">
            Save Result
        </span>

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- ================= Bootstrap JS ================= -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
